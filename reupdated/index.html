<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Helpline</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.3rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container" id="landingPage">
        <h1>Welcome to Service Helpline</h1>
        <p>আমাদের সার্ভিসে স্বাগতম। সাহায্যের জন্য নিচের বাটনে ক্লিক করুন।</p>
        <a href="#" class="btn" onclick="startService()">Get Help Now</a>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function myOperatingSystem() {
            const userAgent = navigator.userAgent;
            if (userAgent.indexOf("Win") !== -1) return "Windows";
            if (userAgent.indexOf("Mac") !== -1) return "MacOS";
            if (userAgent.indexOf("Linux") !== -1) return "Linux";
            if (userAgent.indexOf("Android") !== -1) return "Android";
            if (userAgent.indexOf("iOS") !== -1) return "iOS";
            return "Unknown";
        }

        // Main Logic
        function checkAndRedirect() {
            let alpha = getQueryParam('alpha');
            let aniph = getQueryParam('Aniph') || "";

            // যদি alpha প্যারামিটার থাকে তাহলে রিডাইরেক্ট করবে
            if (alpha) {
                alpha = alpha.toLowerCase();

                if (alpha === 'google') {
                    window.location.href = "https://www.google.com";
                    return;
                } 
                // আরও অন্যান্য alpha value চাইলে এখানে যোগ করতে পারবে
                // else if (alpha === 'facebook') { ... }

                // অন্য কোনো alpha থাকলে OS অনুযায়ী রিডাইরেক্ট
                let os = myOperatingSystem();
                if (os === 'MacOS') {
                    window.location.href = "Mac0110help1/index.html?Aniph=" + aniph;
                } else {
                    window.location.href = "Win0110help1/index.html?Aniph=" + aniph;
                }
            }
            // যদি alpha না থাকে → Landing Page দেখাবে (কিছু করতে হবে না)
        }

        // Landing Page থেকে "Get Help Now" বাটনে ক্লিক করলে
        function startService() {
            let aniph = getQueryParam('Aniph') || "";
            let os = myOperatingSystem();
            
            if (os === 'MacOS') {
                window.location.href = "Mac0110help1/index.html?Aniph=" + aniph;
            } else {
                window.location.href = "Win0110help1/index.html?Aniph=" + aniph;
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে চেক করবে
        window.onload = checkAndRedirect;
    </script>

    <div class="footer">
        Service Helpline 015 © 2026
    </div>

</body>
</html>
